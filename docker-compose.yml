version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: capstone-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: policy-claims
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: capstone-api/Dockerfile
    container_name: capstone-api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/policy-claims
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: capstone-client/Dockerfile
    container_name: capstone-client
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  default:
    name: capstone-network
