apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-client
  namespace: policy-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capstone-client
  template:
    metadata:
      labels:
        app: capstone-client
    spec:
      containers:
        - name: capstone-client
          image: capstone-client:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-client
  namespace: policy-claims
spec:
  selector:
    app: capstone-client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
